# 套件验收 CI（N4/N5）——开源发布后随仓库启用（当前发布暂缓，本文件为工程资产，不本地运行）。
# 前提：套件根 = 仓库根（checkout 后 requirements.txt / scripts/ / examples/ 在根）。
# Java 25 = Pellet 硬要求（skills/ontology-model/references/reasoner-limits.md §一）；
# Pellet/HermiT jar 随 owlready2 pip 包内置，无需单独下载。
# node 20 = review self_test E9 模板 JS 语法检查（缺失时 E9 降级 skip，不阻塞）。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      # LibreOffice = ingest 2.0 office→PDF 全视觉渲染可选增强（MPL-2.0 独立子进程）。
      # T14 以 --no-office-render 强制 substrate-only canonical 档（环境无关，limits ⑪）；
      # 此步验证可选依赖可安装 + doctor 探测，不改变 T14 canonical 断言。
      - name: Install LibreOffice (ingest office render, optional)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice
      - name: Suite acceptance (T1-T15 + py_compile)
        run: python scripts/run_suite_tests.py
